<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="SeaFern Studios – independent game studio. Currently working on a port tycoon game." />
  <title>SeaFern Studios</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;800&family=Barlow+Condensed:wght@800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f2433;
      --bg-deep: #0b1c28;
      --ink: #eef2f4;
      --muted: #a9c3cc;
      --mint: #8fd6c4;
      --line: #1f3b4f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Manrope, ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      width: min(1040px, calc(100% - 40px));
      margin: 0 auto;
    }

    /* ---------- Studio logo ---------- */
    .studio {
      padding: 72px 0 56px;
      text-align: center;
    }

    .studio svg {
      width: min(560px, 90%);
      height: auto;
    }

    /* ---------- Projects ---------- */
    .projects {
      padding: 40px 0 90px;
      border-top: 1px solid var(--line);
    }

    .projects h2 {
      margin: 0 0 36px;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      text-align: center;
    }

    .project {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 48px;
      align-items: center;
    }

    .project h3 {
      margin: 0 0 10px;
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .project .tag {
      display: inline-block;
      margin-bottom: 18px;
      padding: 5px 12px;
      border: 1px solid var(--line);
      border-radius: 99px;
      color: var(--mint);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .project p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
    }

    /* ---------- Computer ---------- */
    .computer { width: 100%; max-width: 560px; margin: 0 auto; }

    .monitor {
      padding: 14px;
      border-radius: 16px;
      background: #2a3a46;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.35), inset 0 0 0 2px #34495a;
    }

    .screen {
      position: relative;
      aspect-ratio: 2 / 1;
      overflow: hidden;
      border-radius: 6px;
      background: #16232f;
    }

    .screen svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* the not-yet-loaded part of the logo */
    .unloaded {
      position: absolute;
      left: 0;
      right: 0;
      top: 40%;
      bottom: 0;
      background: #16232f;
    }

    /* line where the image is "loading" */
    .unloaded::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, rgba(143, 214, 196, 0.5), transparent);
      background-size: 50% 100%;
      background-repeat: no-repeat;
      animation: scan 2.4s linear infinite;
    }

    .loading {
      position: absolute;
      left: 50%;
      bottom: 16%;
      transform: translateX(-50%);
      width: 46%;
      text-align: center;
      color: var(--muted);
      font-size: clamp(0.6rem, 1.6vw, 0.8rem);
      letter-spacing: 0.25em;
    }

    .bar {
      height: 6px;
      margin-top: 10px;
      overflow: hidden;
      border-radius: 6px;
      background: #24394a;
    }

    .bar span {
      display: block;
      width: 37%;
      height: 100%;
      border-radius: inherit;
      background: #e8a33d;
    }

    .neck {
      width: 16%;
      height: 46px;
      margin: 0 auto;
      background: linear-gradient(#2a3a46, #22303a);
    }

    .base {
      width: 42%;
      height: 12px;
      margin: 0 auto;
      border-radius: 12px 12px 4px 4px;
      background: #2a3a46;
    }

    @keyframes scan {
      from { background-position: -50% 0; }
      to { background-position: 150% 0; }
    }

    footer {
      padding: 24px 0 36px;
      border-top: 1px solid var(--line);
      color: #6f8c99;
      font-size: 0.8rem;
      text-align: center;
    }

    @media (max-width: 760px) {
      .studio { padding: 48px 0 36px; }
      .project { grid-template-columns: 1fr; gap: 32px; text-align: center; }
    }

    @media (prefers-reduced-motion: reduce) {
      .unloaded::before { animation: none; }
    }
  </style>
</head>
